[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "music-organizer"
version = "0.9.0"
description = "Sort a messy music folder into Artist/Album, merging name spellings and de-duplicating by audio content."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["music", "mp3", "flac", "id3", "tags", "organizer", "deduplication", "mutagen"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Utilities",
]
dependencies = ["mutagen>=1.45"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
music-organizer = "MusicOrganizer:main"

[tool.setuptools]
py-modules = ["MusicOrganizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
